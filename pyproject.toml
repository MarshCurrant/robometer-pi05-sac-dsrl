[project]
name = "robometer-pi05-sac-dsrl"
version = "0.1.0"
description = "Reproducible RoboMeter-guided SAC-DSRL for a frozen Pi0.5 policy in LIBERO"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "MarshCurrant"}]
dependencies = [
  "aiohttp>=3.11,<4",
  "augmax==0.4.1",
  "bddl>=3.5,<4",
  "beartype==0.19.0",
  "chex==0.1.90",
  "easydict>=1.13,<2",
  "einops==0.8.2",
  "etils>=1.12,<2",
  "flax==0.10.2",
  "gym==0.26.2",
  "gymnasium==0.29.1",
  "h5py>=3.12,<4",
  "huggingface-hub>=0.34,<1",
  "hydra-core>=1.3,<1.5",
  "imageio==2.37.4",
  "jax==0.5.3",
  "jaxlib==0.5.3",
  # OpenPI patches a jaxtyping 0.2.x internal API during import.
  "jaxtyping==0.2.36",
  "loguru>=0.7,<1",
  "matplotlib>=3.9,<4",
  "ml-collections>=1,<2",
  "mujoco==3.8.1",
  "numpy==1.26.4",
  "numpydantic==1.8.1",
  "omegaconf>=2.3,<2.5",
  "opencv-python-headless==4.11.0.86",
  "optax>=0.2.4,<1",
  "orbax-checkpoint>=0.11,<1",
  "pillow>=11,<13",
  "ray>=2.40,<3",
  "requests>=2.32,<3",
  "rich>=13,<16",
  "robosuite==1.4.1",
  "safetensors>=0.5,<1",
  "sentencepiece>=0.2,<1",
  "torch>=2.8,<2.12",
  "torchvision>=0.23,<0.27",
  "tqdm>=4.67,<5",
  "tqdm-loggable==0.4.1",
  "transformers==4.53.2",
  "tyro>=0.9,<2",
  "typeguard>=4.4,<5",
  "wandb>=0.19,<0.26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".", "vendor/openpi", "vendor/rlinf", "vendor/robometer", "vendor/libero"]
include = ["robometer_policy_learning*", "openpi*", "openpi_client*", "rlinf*", "robometer*", "libero*"]
exclude = ["*.tests*", "*.conftest", "libero.libero.assets*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.bddl", "*.xml"]

# `load_env.sh` links downloaded simulator assets into LIBERO's package tree.
# Never follow that machine-local link when building a source or wheel archive.
[tool.setuptools.exclude-package-data]
"libero.libero" = ["assets/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
